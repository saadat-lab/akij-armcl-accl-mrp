  document.querySelector('#allRm tbody').innerHTML=rows.map(r=>`<tr><td class="l">${r.name}</td><td><b>${r.abc}</b></td>${r.monthly.map(v=>`<td>${Math.round(v).toLocaleString()}</td>`).join('')}<td><b>${f(r.req18)}</b></td><td>${r.cover.toFixed(2)}</td><td><span class="badge ${dc(r.decision)}">${r.decision}</span></td></tr>`).join('');
}

Plotly.newPlot('coverChart',[{x:D.rm.map(r=>r.name),y:D.rm.map(r=>r.cover),type:'bar',marker:{color:D.rm.map(r=>r.cover<1?'#B23A2F':r.cover<1.5?'#C97B2E':'#2E7D5B')}}],{plot_bgcolor:'#F7F7F5',paper_bgcolor:'#F7F7F5',margin:{t:10,b:120},height:280,yaxis:{title:'Months covered'}},{responsive:true});
